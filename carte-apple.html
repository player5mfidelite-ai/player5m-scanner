<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Carte fidélité Player 5M</title>

  <link rel="icon" type="image/png" href="icone-512-ronde.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .bloc {
      max-width: 360px;
    }

    img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .texte {
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
  <script type="module" src="notifications-apple.js"></script>
</head>

<body>

  <div class="bloc">
    <img src="icone-512-ronde.png" alt="Player 5M">

    <div class="texte">
      Ouverture de votre carte de fidélité Player 5M...
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const carte = params.get('carte');

  if (carte && window.navigator.standalone === true) {
  document.body.innerHTML = `
    <iframe
      src="${carte}"
      style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#111;"
      allow="camera">
    </iframe>
  `;
}

  window.addEventListener("message", function(event) {
  alert("Message reçu : " + JSON.stringify(event.data));
});
    
  </script>

</body>
</html>
