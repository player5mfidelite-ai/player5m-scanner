<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Carte fidélité Player 5M</title>

  <link rel="icon" type="image/png" href="icone-512-ronde.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .bloc {
      max-width: 360px;
    }

    img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .texte {
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
  <script type="module" src="notifications-apple.js?v=230826-3"></script>
</head>

<body>

  <div class="bloc">
    <img src="icone-512-ronde.png" alt="Player 5M">

    <div class="texte">
      Ouverture de votre carte de fidélité Player 5M...
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientDirect = params.get("client") || "";
    const carte =
  params.get('carte') ||
  (
    'https://script.google.com/macros/s/AKfycbyZHXWM1EiMFAndTdAJtqbY0L_Hw8TH76PTFYMFbHzMHsQf3d-6l-5MND4w7z63VKI/exec?client=' +
    encodeURIComponent(clientDirect)
  );

 if (carte) {
  document.body.innerHTML = `
    <iframe
      src="${carte}"
      style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#111;"
      allow="camera">
    </iframe>

  `;

const estApplicationInstallee =
  window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

if (!estApplicationInstallee) {
  const aideInstallation = document.createElement("div");

  aideInstallation.style.cssText =
    "position:fixed;left:18px;right:18px;bottom:90px;" +
    "z-index:999999;background:#1d1d1d;color:white;" +
    "border:2px solid #e30620;border-radius:18px;" +
    "padding:18px;text-align:center;font-family:Arial,sans-serif;" +
    "box-shadow:0 8px 30px rgba(0,0,0,.65);";

  aideInstallation.innerHTML = `
    <div style="font-size:21px;font-weight:bold;color:#ffcc00;">
      ✅ Votre carte est prête !
    </div>

    <div style="margin-top:10px;font-size:17px;line-height:1.45;">
      Appuyez maintenant sur <strong>Partager</strong> ⬆️<br>
      puis choisissez <strong>« Sur l’écran d’accueil »</strong><br>
      et appuyez sur <strong>Ajouter</strong>.
    </div>
  `;

  document.body.appendChild(aideInstallation);
}
   
    window.addEventListener("DOMContentLoaded", function() {
      window.afficherBoutonActivation();
    });
   
}

    window.addEventListener("message", function(event) {
  if (
    event.data &&
    event.data.type === "PLAYER5M_ACTIVER_NOTIFICATIONS"
  ) {
    window.afficherBoutonActivation();
  }
});
    
  </script>

</body>
</html>
