<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#111111">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icone-512-ronde.png">
  <link rel="apple-touch-icon" href="icone-512-ronde.png">

  <title>Player 5M</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .conteneur {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      width: 190px;
      max-width: 60%;
      margin-bottom: 30px;
      border-radius: 50%;
    }

    h1 {
      color: #ffcc00;
      font-size: 38px;
      margin: 0 0 12px;
    }

    .sous-titre {
      color: #ccc;
      font-size: 20px;
      margin-bottom: 42px;
    }

    .bouton {
      display: block;
      width: 100%;
      padding: 22px 16px;
      margin: 18px 0;
      border-radius: 18px;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
    }

    .administration {
      background: #ed001f;
      color: white;
    }

    .scanner {
      background: #ffcc00;
      color: #111;
    }

  </style>

</head>

<body>

  <div class="conteneur">

    <img
      class="logo"
      src="icone-512-ronde.png"
      alt="Player 5M">

    <h1>Player 5M</h1>

    <div class="sous-titre">
      Application fidélité
    </div>

    <a
      class="bouton administration"
      href="https://script.google.com/macros/s/AKfycbyZHXWM1EiMFAndTdAJtqbY0L_Hw8TH76PTFYMFbHzMHsQf3d-6l-5MND4w7z63VKI/exec?page=dashboard">
      ⚙️ Administration
    </a>

    <a
      class="bouton scanner"
      href="scanner.html">
      📷 Scanner / Créditer
    </a>

  </div>

</body>

</html>
